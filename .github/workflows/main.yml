name: Crypto Signal Bot

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    # تم تثبيت الإصدار لتجنب التحديث التلقائي المفاجئ إلى Ubuntu 26.04
    runs-on: ubuntu-24.04

    steps:
      - name: Get code
        # تم التحديث إلى v4 لحل مشكلة توقف دعم Node.js 20
        uses: actions/checkout@v4

      - name: Setup Python
        # تم التحديث إلى v5 لحل مشكلة توقف دعم Node.js 20
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install libraries
        run: pip install -r requirements.txt

      - name: Run Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: python bot.py
